<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Albums | Music Library</title>
        <link rel="stylesheet" href="styles.css">
    </head>

    <body>
        <header>
            <nav id="nav_bar">
                <a href="index.html">Home</a>
                <a href="artists.html">Artists</a>
                <a href="albums.html" class="current">Albums</a>
                <a href="songs.html">Songs</a>
            </nav>
        </header>

        <main>
            <section class="card">
                <h1>Albums</h1>
                <form id="album_form">
                    <label for="album_name">Album name</label>
                    <input type="text" id="album_name" name="album_name">

                    <label for="release_year">Release year</label>
                    <input type="number" id="release_year" name="release_year" min="1900">

                    <label for="num_of_listens">Number of listens</label>
                    <input type="number" id="num_of_listens" name="num_of_listens" min="1">

                    <label for="artist_id">Artist</label>
                    <select id="artist_id" name="artist_id"></select>

                    <div class="buttons">
                        <button type="button" id="create_button" onclick="createAlbum()">Create</button>
                        <button type="button" id="update_button" onclick="updateAlbum()" disabled>Update</button>
                        <button type="button" id="clear_button" onclick="clearForm()">Clear</button>
                    </div>
                </form>
                <p id="message"></p>
            </section>

            <section class="card">
                <h2>All albums</h2>
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Album name</th>
                            <th>Release year</th>
                            <th>Number of listens</th>
                            <th>Artist</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="album_rows"></tbody>
                </table>
            </section>
        </main>

        <footer>
            <p>&copy; Aidan Hughes | CS230</p>
        </footer>
        <script src="albums.js"></script>
    </body>
</html>
